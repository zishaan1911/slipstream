<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 520" font-family="Helvetica, Arial, sans-serif" font-size="13">
  <rect width="1000" height="520" fill="#ffffff"/>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#555"/></marker>
  </defs>
  <text x="30" y="34" font-size="18" font-weight="700" fill="#15171a">Gannet roll rig</text>
  <text x="30" y="54" fill="#6b7178">side view (roll axis in the page)  ·  end view (looking along the roll axis)  ·  mm</text>

  <!-- side view -->
  <g transform="translate(60,90)">
    <text x="0" y="0" font-weight="700" fill="#15171a">SIDE</text>
    <!-- base rail 600 -->
    <rect x="0" y="360" width="600" height="20" fill="#c9ccd0" stroke="#555"/>
    <!-- uprights 450 at x=40 and x=560 -->
    <rect x="30" y="-70" width="20" height="430" fill="#c9ccd0" stroke="#555"/>
    <rect x="550" y="-70" width="20" height="430" fill="#c9ccd0" stroke="#555"/>
    <!-- bearings -->
    <rect x="22" y="-14" width="36" height="28" rx="4" fill="#8a8f96" stroke="#333"/>
    <rect x="542" y="-14" width="36" height="28" rx="4" fill="#8a8f96" stroke="#333"/>
    <!-- roll axis -->
    <line x1="0" y1="0" x2="600" y2="0" stroke="#f26a1b" stroke-width="1.5" stroke-dasharray="10 5"/>
    <text x="252" y="-12" fill="#f26a1b">roll axis = airframe long axis, through the CoM</text>
    <!-- stub axles + adapters -->
    <rect x="58" y="-4" width="60" height="8" fill="#555"/>
    <rect x="482" y="-4" width="60" height="8" fill="#555"/>
    <rect x="118" y="-26" width="22" height="52" rx="4" fill="#e9e0d5" stroke="#555"/>
    <rect x="460" y="-26" width="22" height="52" rx="4" fill="#e9e0d5" stroke="#555"/>
    <!-- airframe body (folded) -->
    <rect x="140" y="-28" width="320" height="56" rx="22" fill="#f4f4f2" stroke="#333"/>
    <text x="300" y="5" text-anchor="middle" font-weight="700" fill="#15171a">GANNET</text>
    <!-- folded arms + props -->
    <line x1="190" y1="20" x2="110" y2="70" stroke="#333" stroke-width="6"/>
    <line x1="410" y1="20" x2="490" y2="70" stroke="#333" stroke-width="6"/>
    <ellipse cx="105" cy="74" rx="62" ry="6" fill="#9aa0a6" opacity="0.5"/>
    <ellipse cx="495" cy="74" rx="62" ry="6" fill="#9aa0a6" opacity="0.5"/>
    <!-- encoder -->
    <rect x="580" y="-10" width="18" height="20" fill="#2f8f4e" stroke="#333"/>
    <text x="585" y="-20" fill="#2f8f4e">AS5600</text>
    <!-- shields -->
    <line x1="40" y1="110" x2="170" y2="110" stroke="#5fa8d3" stroke-width="3"/>
    <line x1="430" y1="110" x2="560" y2="110" stroke="#5fa8d3" stroke-width="3"/>
    <text x="300" y="115" text-anchor="middle" fill="#5fa8d3">polycarbonate shields in the prop planes</text>
    <!-- dims -->
    <line x1="0" y1="410" x2="600" y2="410" stroke="#555" marker-start="url(#a)" marker-end="url(#a)"/>
    <text x="300" y="428" text-anchor="middle" fill="#333">600</text>
    <line x1="-25" y1="0" x2="-25" y2="380" stroke="#555" marker-start="url(#a)" marker-end="url(#a)"/>
    <text x="-30" y="195" text-anchor="end" fill="#333">420</text>
    <line x1="40" y1="-55" x2="560" y2="-55" stroke="#555" marker-start="url(#a)" marker-end="url(#a)"/>
    <text x="300" y="-60" text-anchor="middle" fill="#333">520 between bearings (KFL08, 8 mm)</text>
  </g>

  <!-- end view -->
  <g transform="translate(790,90)">
    <text x="-100" y="0" font-weight="700" fill="#15171a">END</text>
    <rect x="-100" y="360" width="200" height="20" fill="#c9ccd0" stroke="#555"/>
    <rect x="-10" y="-70" width="20" height="430" fill="#c9ccd0" stroke="#555"/>
    <circle cx="0" cy="0" r="18" fill="#8a8f96" stroke="#333"/>
    <!-- airframe rolled 90 deg right: deck faces +x (page right) -->
    <g transform="rotate(90)">
      <rect x="-50" y="-34" width="100" height="56" rx="18" fill="#f4f4f2" stroke="#333"/>
      <line x1="-50" y1="0" x2="-120" y2="0" stroke="#333" stroke-width="6"/>
      <line x1="50" y1="0" x2="120" y2="0" stroke="#333" stroke-width="6"/>
    </g>
    <path d="M -80 -120 A 145 145 0 0 1 80 -120" fill="none" stroke="#f26a1b" stroke-width="2" marker-end="url(#a)"/>
    <text x="0" y="-150" text-anchor="middle" fill="#f26a1b">roll free, ±135° end stops</text>
    <line x1="-100" y1="410" x2="100" y2="410" stroke="#555" marker-start="url(#a)" marker-end="url(#a)"/>
    <text x="0" y="428" text-anchor="middle" fill="#333">400</text>
  </g>
  <text x="30" y="505" fill="#6b7178">CoM on the axis: with props off the airframe must stay at any roll angle it is left at (counterweights).  Not to scale.</text>
</svg>
